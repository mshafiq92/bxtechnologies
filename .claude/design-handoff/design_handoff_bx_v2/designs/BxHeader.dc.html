<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header onMouseLeave="{{ closeMega }}" style="position:relative;background:#FFFFFF;border-bottom:1px solid #DCE6EF;font-family:Inter,system-ui,sans-serif">
  <div style="max-width:1248px;margin:0 auto;padding:0 clamp(16px,4vw,24px);height:72px;display:flex;align-items:center;gap:32px">
    <a href="bX v2 - Home.dc.html" aria-label="bX Technologies home" style="display:flex;align-items:center;gap:10px;color:#0A1F33;text-decoration:none">
      <img src="assets/bx-mark.png" alt="bX" style="height:32px;width:auto;display:block">
      <span style="font-weight:500;font-size:18px;letter-spacing:-0.01em">Technologies</span>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;gap:4px;margin-left:auto">
        <a href="bX v2 - Services.dc.html" onMouseEnter="{{ openMega }}" onFocus="{{ openMega }}" aria-expanded="{{ mega }}" aria-current="{{ svcCurrent }}" style="position:relative;display:inline-flex;align-items:center;gap:6px;color:{{ svcColor }};font-weight:500;font-size:15px;padding:12px 14px;border-radius:8px;text-decoration:none;white-space:nowrap;transition:background-color 150ms,color 150ms" style-hover="background:#F4F8FB;color:#006EA3">Services<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg><sc-if value="{{ svcActive }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:#00AEEF"></span></sc-if></a>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
          <a href="{{ l.href }}" onMouseEnter="{{ closeMega }}" aria-current="{{ l.current }}" style="position:relative;color:#0A1F33;font-weight:500;font-size:15px;padding:12px 14px;border-radius:8px;text-decoration:none;white-space:nowrap;transition:background-color 150ms,color 150ms" style-hover="background:#F4F8FB;color:#006EA3">{{ l.label }}<sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:#00AEEF"></span></sc-if></a>
        </sc-for>
      </nav>
      <a href="bX v2 - Contact.dc.html" onMouseEnter="{{ closeMega }}" style="display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:8px;background:#00AEEF;color:#0A1F33;font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;transition:background-color 150ms" style-hover="background:#33C1F3;color:#0A1F33">Start a project</a>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggle }}" aria-expanded="{{ open }}" aria-controls="bx-mnav" style="margin-left:auto;height:44px;min-width:44px;padding:0 16px;border:1px solid #6B7F93;border-radius:8px;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:15px;color:#0A1F33;cursor:pointer">{{ menuLabel }}</button>
    </sc-if>
  </div>

  <sc-if value="{{ showMega }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:100%;background:#FFFFFF;border-bottom:1px solid #DCE6EF;box-shadow:0 1px 2px rgba(10,31,51,0.06),0 8px 24px rgba(10,31,51,0.06)">
      <div style="max-width:1248px;margin:0 auto;padding:32px clamp(16px,4vw,24px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:4px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:13px;line-height:18px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#4A5B6C;margin-bottom:8px">{{ g.t }}</span>
            <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
              <a href="{{ it.href }}" style="display:flex;align-items:center;min-height:44px;font-size:16px;font-weight:500;color:#0A1F33;text-decoration:none" style-hover="color:#006EA3">{{ it.t }}</a>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <div style="border-top:1px solid #DCE6EF;background:#F4F8FB">
        <div style="max-width:1248px;margin:0 auto;padding:8px clamp(16px,4vw,24px);display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px">
          <a href="bX v2 - Services.dc.html" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;font-weight:600;color:#006EA3;text-decoration:none" style-hover="color:#0A1F33">All services <span aria-hidden="true">→</span></a>
          <a href="bX v2 - Industries.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:500;color:#0A1F33;text-decoration:none" style-hover="color:#006EA3">Industries</a>
          <a href="bX v2 - Services.dc.html#engagement" style="display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:500;color:#0A1F33;text-decoration:none" style-hover="color:#006EA3">Engagement models</a>
          <span style="margin-left:auto;font-size:14px;line-height:22px;color:#4A5B6C">Every capability has delivered, running systems behind it</span>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showPanel }}" hint-placeholder-val="{{ false }}">
    <div id="bx-mnav" style="border-top:1px solid #DCE6EF;background:#FFFFFF;padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px">
      <ul style="list-style:none;margin:0;padding:0">
        <li style="border-bottom:1px solid #DCE6EF"><a href="bX v2 - Services.dc.html" style="display:flex;justify-content:space-between;align-items:center;min-height:56px;color:#0A1F33;font-weight:500;font-size:17px;text-decoration:none">Services<span aria-hidden="true" style="color:#4A5B6C">→</span></a></li>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
          <li style="border-bottom:1px solid #DCE6EF"><a href="{{ l.href }}" aria-current="{{ l.current }}" style="display:flex;justify-content:space-between;align-items:center;min-height:56px;color:#0A1F33;font-weight:500;font-size:17px;text-decoration:none">{{ l.label }}<span aria-hidden="true" style="color:#4A5B6C">→</span></a></li>
        </sc-for>
      </ul>
      <a href="bX v2 - Contact.dc.html" style="display:flex;justify-content:center;align-items:center;height:48px;border-radius:8px;background:#00AEEF;color:#0A1F33;font-weight:600;font-size:16px;text-decoration:none">Start a project</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;73px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;work&quot;,&quot;insights&quot;,&quot;company&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, open: false, mega: false };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onK = e => { if (e.key === 'Escape') this.setState({ mega: false }); };
    window.addEventListener('resize', this.onR); window.addEventListener('keydown', this.onK);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('keydown', this.onK); }
  renderVals() {
    const a = this.props.active;
    const narrow = this.state.w < 900;
    const S = 'bX v2 - Services.dc.html';
    const links = [
      ['work', 'Work', 'bX v2 - Projects.dc.html'],
      ['insights', 'Insights', 'bX v2 - Insights.dc.html'],
      ['company', 'Company', 'bX v2 - About.dc.html']
    ].map(([k, label, href]) => ({ label, href, active: k === a, current: k === a ? 'page' : undefined }));
    const groups = [
      { t: 'AI & Autonomy', items: [['Agentic AI & agents', 'bX v2 - Service Detail.dc.html'], ['Generative AI integration', S + '#ai'], ['AI/ML engineering', S + '#ai']] },
      { t: 'Data & Cloud', items: [['Data engineering & analytics', S + '#data'], ['Cloud & DevOps', 'bX v2 - Service Detail - Cloud DevOps.dc.html'], ['IoT & embedded', S + '#data']] },
      { t: 'Product Engineering', items: [['Custom software', 'bX v2 - Service Detail - Custom Software.dc.html'], ['Web & mobile apps', S + '#product'], ['QA & test automation', S + '#product']] },
      { t: 'Teams & Advisory', items: [['Dedicated teams', S + '#teams'], ['Digital transformation', S + '#teams'], ['Blockchain & distributed', S + '#teams']] }
    ].map(g => ({ t: g.t, items: g.items.map(([t, href]) => ({ t, href })) }));
    const svcActive = a === 'services' || this.state.mega;
    return {
      links, groups, narrow, wide: !narrow, open: this.state.open,
      mega: this.state.mega, showMega: !narrow && this.state.mega,
      svcActive: a === 'services', svcCurrent: a === 'services' ? 'page' : undefined,
      svcColor: svcActive ? '#006EA3' : '#0A1F33',
      openMega: () => this.setState({ mega: true }),
      closeMega: () => this.setState({ mega: false }),
      showPanel: narrow && this.state.open,
      menuLabel: this.state.open ? 'Close' : 'Menu',
      toggle: () => this.setState(s => ({ open: !s.open }))
    };
  }
}
</script>
</body>
</html>
