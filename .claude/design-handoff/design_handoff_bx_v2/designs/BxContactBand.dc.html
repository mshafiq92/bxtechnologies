<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="contact" data-deep="" style="background:#0A1F33;color:#F4F8FB;font-family:Inter,system-ui,sans-serif">
  <div style="height:3px;background:linear-gradient(90deg,#00AEEF,#79BB42)"></div>
  <div style="max-width:1248px;margin:0 auto;padding:clamp(64px,8vw,96px) clamp(16px,4vw,24px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px 48px">
    <div style="display:flex;flex-direction:column;gap:16px;max-width:680px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;line-height:18px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#5BC8F5">{{ eyebrow }}</span>
      <h2 style="margin:0;font-size:clamp(28px,3vw,36px);line-height:1.1667;font-weight:600;letter-spacing:-0.025em;color:#F4F8FB;text-wrap:balance">{{ title }}</h2>
      <p style="margin:0;font-size:18px;line-height:28px;color:#A9B8C8;text-wrap:pretty">{{ text }}</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px">
      <a href="{{ ctaHref }}" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;white-space:nowrap;background:#00AEEF;color:#0A1F33;font-weight:600;font-size:16px;text-decoration:none;transition:background-color 150ms" style-hover="background:#33C1F3;color:#0A1F33">{{ cta }}</a>
      <a href="{{ secondaryHref }}" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:16px;font-weight:500;color:#5BC8F5;text-decoration:none;white-space:nowrap" style-hover="color:#F4F8FB">{{ secondary }}</a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;330px&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Start a project&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tell us what is slow, manual or breaking.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a technical call&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;bX v2 - Contact.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;info@bxtechnologies.net&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;mailto:info@bxtechnologies.net&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      eyebrow: p.eyebrow ?? 'Start a project',
      title: p.title ?? 'Tell us what is slow, manual or breaking.',
      text: p.text ?? 'A 30-minute call with the engineers who would do the work. You leave with an approach, whether or not you hire us.',
      cta: p.cta ?? 'Book a technical call',
      ctaHref: p.ctaHref ?? 'bX v2 - Contact.dc.html',
      secondary: p.secondary ?? 'info@bxtechnologies.net',
      secondaryHref: p.secondaryHref ?? 'mailto:info@bxtechnologies.net'
    };
  }
}
</script>
</body>
</html>
